[build-system]
requires = ["hatchling>=1.26,<2"]
build-backend = "hatchling.build"

[project]
name = "convxai"
version = "0.1.0"
description = "A reproducible reference implementation of conversational explainable AI."
readme = "README.md"
requires-python = ">=3.11,<3.14"
license = "MIT"
authors = [{ name = "Navid Nobani" }]
keywords = ["explainable-ai", "conversational-ai", "xai", "machine-learning"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
]
dependencies = [
  "fastapi>=0.115,<1",
  "numpy>=1.26,<3",
  "scikit-learn>=1.5,<2",
  "uvicorn>=0.32,<1",
]

[project.optional-dependencies]
dev = [
  "httpx2>=2,<3",
  "pytest>=8,<10",
  "ruff>=0.9,<1",
]

[project.scripts]
convxai = "convxai.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/convxai"]

[tool.hatch.build.targets.sdist]
include = [
  "/.github/workflows/ci.yml",
  "/assets",
  "/src/convxai",
  "/tests",
  "/scripts",
  "/CITATION.cff",
  "/LICENSE",
  "/README.md",
  "/pyproject.toml",
  "/uv.lock",
]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
